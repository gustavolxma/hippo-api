spring.application.name=hippo-api

# Banco de dados. Os valores padrao servem para rodar no computador (PostgreSQL local);
# no servidor eles vem das variaveis de ambiente (arquivo .env do docker compose).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/hippo-api}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:123}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.port=${PORT:8080}
# A API fica atras do Caddy (HTTPS); assim ela enxerga o endereco e o protocolo originais
server.forward-headers-strategy=framework

# Token de acesso (JWT).
# JWT_SECRET: texto aleatorio com pelo menos 32 caracteres (gere com: openssl rand -base64 48).
# Sem ele, a API cria uma chave temporaria a cada inicio e todos precisam entrar de novo.
hippo.jwt.secret=${JWT_SECRET:}
hippo.jwt.validade-horas=${JWT_VALIDADE_HORAS:168}

# Envio dos Codigos de Verificacao por Email.
# "log" (padrao) so escreve o Codigo no console, para desenvolver sem conta de Email.
# "brevo" envia de verdade pela API HTTP da Brevo.
# Os valores vem de variaveis de ambiente: nunca coloque a chave da API no Git.
hippo.email.provedor=${EMAIL_PROVEDOR:log}
hippo.email.brevo.api-key=${BREVO_API_KEY:}
hippo.email.remetente-email=${EMAIL_REMETENTE:}
hippo.email.remetente-nome=${EMAIL_REMETENTE_NOME:Hippo}

# Interpretacao dos comandos de voz com o Gemini (chave criada no Google AI Studio).
# O modelo "lite" tem a maior cota diaria no plano gratuito; confira os limites no AI Studio.
hippo.ia.gemini.api-key=${GEMINI_API_KEY:}
hippo.ia.gemini.modelo=${GEMINI_MODELO:gemini-flash-lite-latest}
