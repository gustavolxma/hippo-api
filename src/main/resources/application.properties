spring.application.name=hippo-api

spring.datasource.url=jdbc:postgresql://localhost:5432/hippo-api
spring.datasource.username=postgres
spring.datasource.password=123
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.port=8080

# Envio dos Codigos de Verificacao por Email.
# "log" (padrao) so escreve o Codigo no console, para desenvolver sem conta de Email.
# "brevo" envia de verdade pela API HTTP da Brevo (o Render gratuito bloqueia SMTP).
# Os valores vem de variaveis de ambiente: nunca coloque a chave da API no Git.
hippo.email.provedor=${EMAIL_PROVEDOR:log}
hippo.email.brevo.api-key=${BREVO_API_KEY:}
hippo.email.remetente-email=${EMAIL_REMETENTE:}
hippo.email.remetente-nome=${EMAIL_REMETENTE_NOME:Hippo}
